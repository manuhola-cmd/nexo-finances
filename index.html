<style>
:root {
  --bg: #F1F3F7; --surface: #FFFFFF; --sunk: #E7EAF1; --line: #DCE1EA;
  --ink: #141B2E; --muted: #5E6880;
  --hero: #182447; --hero-2: #24356A; --hero-ink: #F3F6FF; --hero-muted: #AEB9D9;
  --in: #0E9A6C; --in-soft: #DDF4EB;
  --out: #D9473A; --out-soft: #FBE5E2;
  --save: #6B4FD8; --save-soft: #ECE7FD;
  --warn: #B86E00; --warn-soft: #FDF0D9;
  --accent: #2E52D6; --accent-ink: #FFFFFF;
  --m0: #2E52D6; --m1: #D14D8B; --m2: #C27C0E; --m3: #0E9A6C;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1020; --surface: #141B30; --sunk: #1B2440; --line: #253055;
    --ink: #E9EDF8; --muted: #98A3C0;
    --hero: #1B2A57; --hero-2: #2B3F80; --hero-ink: #F3F6FF; --hero-muted: #AEB9D9;
    --in: #46D6A3; --in-soft: #11352B;
    --out: #FF7B6B; --out-soft: #3B1C1C;
    --save: #A898FF; --save-soft: #272150;
    --warn: #F2B24C; --warn-soft: #3A2C10;
    --accent: #7D97FF; --accent-ink: #0B1020;
    --m0: #7D97FF; --m1: #F08CBB; --m2: #F2B24C; --m3: #46D6A3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1020; --surface: #141B30; --sunk: #1B2440; --line: #253055;
  --ink: #E9EDF8; --muted: #98A3C0;
  --hero: #1B2A57; --hero-2: #2B3F80; --hero-ink: #F3F6FF; --hero-muted: #AEB9D9;
  --in: #46D6A3; --in-soft: #11352B;
  --out: #FF7B6B; --out-soft: #3B1C1C;
  --save: #A898FF; --save-soft: #272150;
  --warn: #F2B24C; --warn-soft: #3A2C10;
  --accent: #7D97FF; --accent-ink: #0B1020;
  --m0: #7D97FF; --m1: #F08CBB; --m2: #F2B24C; --m3: #46D6A3;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px); }
h1, h2, h3, .num { font-family: var(--display); letter-spacing: -0.015em; }
h1 { font-size: 1.6rem; line-height: 1.15; margin: 0; font-weight: 800; }
h2 { font-size: 1.15rem; margin: 0; font-weight: 700; }
h3 { font-size: 1rem; margin: 0; font-weight: 700; }
p { margin: 0 0 .75rem; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .tiny { font-size: .75rem; }
.in { color: var(--in); } .out { color: var(--out); } .sv { color: var(--save); } .warn { color: var(--warn); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 12px; gap: 12px; }
.top .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px;
  display: grid; place-items: center; font-size: 1rem; flex: none; }
.month-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.month-bar .label { font-weight: 700; font-family: var(--display); }
.month-bar .icon-btn { border: 0; background: var(--sunk); width: 34px; height: 34px; }

.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.soft { background: var(--sunk); color: var(--ink); }
.btn.danger { background: transparent; color: var(--out); border: 1px solid var(--out); }
.btn.sm { padding: 7px 12px; font-size: .85rem; border-radius: 9px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }

  const ds = state.entries.filter(isMine).map(e => e.start_date).concat(state.payments.filter(p => p.user_id === state.me.id).map(p => p.due_date)).sort();

}
function monthNet(ym) {
  const cur = ymOf(new Date());
  let inc = 0, exp = 0;
  monthItems(ym, state.entries.filter(isMine)).forEach(it => {
    if (ym < cur && !it.pay) return;              // months that are over: only what really happened
    const a = it.pay ? num(it.pay.amount) : num(it.e.amount);
    if (it.e.kind === 'income') inc += a; else exp += a;
  });
  const saved = state.contribs.filter(c => c.user_id === state.me.id && c.contributed_on.startsWith(ym)).reduce((x, c) => x + num(c.amount), 0);
  return inc - exp - saved;
}
function carryInto(ym) {
  let total = 0;
  for (let m = firstMonth(); m < ym; m = nextMonth(m)) total += monthNet(m);
  return Math.round(total * 100) / 100;
}
function monthSummary(ym) {
  const items = monthItems(ym, state.entries.filter(isMine));
  const s = { ym, items, incPlan: 0, incGot: 0, expPlan: 0, expPaid: 0, saved: 0 };
  items.forEach(it => {
    const a = it.pay ? num(it.pay.amount) : num(it.e.amount);
    if (it.e.kind === 'income') { s.incPlan += a; if (it.pay) s.incGot += a; }
    else { s.expPlan += a; if (it.pay) s.expPaid += a; }
  });
  s.saved = state.contribs.filter(c => c.user_id === state.me.id && c.contributed_on.startsWith(ym)).reduce((x, c) => x + num(c.amount), 0);
  s.expDue = s.expPlan - s.expPaid;
  s.incDue = s.incPlan - s.incGot;
  s.leftOver = s.incPlan - s.expPlan - s.saved;
  // Safe to spend: start with cash in hand, walk through what's still pending in date order
  // (late items first), and take the lowest point the balance reaches this month.
  s.carry = carryInto(ym);
  s.cash = s.carry + s.incGot - s.expPaid - s.saved;
  s.endBalance = s.carry + s.leftOver;
  let run = s.cash, low = s.cash, lowDate = null, nextIncome = null;
  const t = today();
  items.filter(it => !it.pay).map(it => ({ it, d: it.date < t ? t : it.date }))
    .sort((a, b) => a.d.localeCompare(b.d) || (a.it.e.kind === 'income' ? -1 : 1))
    .forEach(({ it, d }) => {
      run += (it.e.kind === 'income' ? 1 : -1) * num(it.e.amount);
      if (it.e.kind === 'income' && !nextIncome) nextIncome = it.date;
      if (run < low - 0.004) { low = run; lowDate = d; }
    });
  s.available = low; s.lowDate = lowDate; s.nextIncome = nextIncome;

}

/* ==========================================================
   PAYCHECK PLAN & CATCH-UP
   ========================================================== */
const PER_YEAR = { weekly: 52, biweekly: 26, fourweekly: 13, monthly: 12, yearly: 1, installments: 12 };
function ordinal(n) { const v = n % 100, sfx = ['th', 'st', 'nd', 'rd']; return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]); }
function dueDateIn(ym, day) { return `${ym}-${pad(Math.min(day, daysIn(ym)))}`; }
function mainIncome() {
  return state.entries.filter(e => isMine(e) && e.kind === 'income' && e.frequency !== 'once' && !e.end_date)
    .sort((a, b) => num(b.amount) * (PER_YEAR[b.frequency] || 0) - num(a.amount) * (PER_YEAR[a.frequency] || 0))[0] || null;
}
// Every pending event (mine) from today over the next `months`, optionally with one entry's dates swapped out
function pendingEvents(months, swap) {
  const t = today(), d = new Date(); const to = iso(new Date(d.getFullYear(), d.getMonth() + months, 1));
  const from = monthStart(ymOf(d));
  const ev = [];
  state.entries.filter(isMine).forEach(e => {
    const dates = swap && swap.id === e.id ? swap.dates : rawOccurrences(e, from, to);
    dates.forEach(dt => { if (!payFor(e.id, dt)) ev.push({ d: dt < t ? t : dt, a: (e.kind === 'income' ? 1 : -1) * num(e.amount) }); });
  });
  if (swap && swap.extra) swap.extra.forEach(dt => ev.push({ d: dt < t ? t : dt, a: -num(swap.amount) }));
  return ev.sort((x, y) => x.d.localeCompare(y.d) || y.a - x.a);
}
function lowestPoint(start, ev) { let run = start, low = start; ev.forEach(x => { run += x.a; if (run < low) low = run; }); return low; }
// For a bill with a due day and late fee: when can it move to on-time, and what does that save?
function catchUpPlan(e) {
  if (!e.due_day || e.kind !== 'expense' || e.end_date || e.frequency === 'once') return null;
  const months = 12, t = today(), d = new Date();
  const to = iso(new Date(d.getFullYear(), d.getMonth() + months, 1));
  const unpaid = rawOccurrences(e, monthStart(ymOf(d)), to).filter(dt => !payFor(e.id, dt));
  if (!unpaid.length) return null;
  const m0 = unpaid[0].slice(0, 7);
  const monthFor = i => nextMonth(m0, i);
  const lateAt = i => unpaid[i] > dueDateIn(monthFor(i), e.due_day);
  const firstOnTime = unpaid.findIndex((_, i) => !lateAt(i));
  const lateCount = (firstOnTime < 0 ? unpaid.length : firstOnTime);
  const cash = monthSummary(ymOf(d)).cash;
  const baseLow = lowestPoint(cash, pendingEvents(months));
  const tryK = k => {
    const kept = unpaid.slice(0, k);
    const extra = []; for (let i = k; i < months; i++) { const ym = monthFor(i); if (ym < nextMonth(ymOf(d), months)) extra.push(dueDateIn(ym, e.due_day)); }
    return { kept, extra, low: lowestPoint(cash, pendingEvents(months, { id: e.id, dates: kept, extra, amount: e.amount })) };
  };
  let best = null;
  for (let k = 0; k <= Math.min(lateCount, months - 1); k++) {
    const r = tryK(k);
    if (r.low >= Math.min(0, baseLow) - 0.01) { best = { k, ...r }; break; }
  }
  const inc = mainIncome();
  const payDay = dt => { if (!inc) return null; const back = iso(new Date(parseD(dt).getFullYear(), parseD(dt).getMonth(), parseD(dt).getDate() - 20));
    const ps = occurrences(inc, back, iso(new Date(parseD(dt).getFullYear(), parseD(dt).getMonth(), parseD(dt).getDate() + 1))); return ps.length ? ps[ps.length - 1] : null; };
  const startYm = best ? monthFor(best.k) : null;
  const firstDue = startYm ? dueDateIn(startYm, e.due_day) : null;
  return { e, lateNow: lateAt(0), lateCount, firstOnTime: firstOnTime < 0 ? null : monthFor(firstOnTime),
    switchYm: startYm, switchK: best ? best.k : null, keepDates: best ? best.kept : null, firstDue, payWith: firstDue ? payDay(firstDue) : null,
    savedFees: best ? Math.max(0, lateCount - best.k) * num(e.late_fee) : 0, monthlySave: num(e.late_fee) + (e.on_autopay ? 0 : num(e.autopay_discount)) };
}
function computePlans() {
  state.plans = {};
  state.entries.filter(e => isMine(e) && e.due_day && num(e.late_fee) > 0).forEach(e => {
    const cp = catchUpPlan(e);
    if (cp && cp.lateNow && cp.switchYm) state.plans[e.id] = { keepEnd: cp.keepDates.length ? cp.keepDates[cp.keepDates.length - 1] : null, switchYm: cp.switchYm, due_day: e.due_day, cp };
  });
}
// Bills on autopay get checked off by themselves once their date arrives
async function autoPayDue() {
  const t = today(), tomorrow = iso(new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 1));
  const rows = [];
  state.entries.filter(e => isMine(e) && e.kind === 'expense' && e.on_autopay).forEach(e =>
    occurrences(e, monthStart(ymOf(new Date())), tomorrow).forEach(d => { if (d <= t && !payFor(e.id, d)) rows.push({ entry_id: e.id, due_date: d, amount: num(e.amount), paid_on: d }); }));
  if (!rows.length) return;
  const { data, error } = await db.from('entry_payments').insert(rows).select();
  if (!error && data) state.payments.push(...data);
}
async function setAutopay(entryId, on) {
  const { error } = await db.from('entries').update({ on_autopay: on }).eq('id', entryId); if (error) return fail(error);
  const e = state.entries.find(x => x.id === entryId); if (e) e.on_autopay = on;
  toast(on ? `${e ? e.description : 'Bill'} is on autopay. It checks itself off on its date.` : 'Autopay off');
  await autoPayDue(); computePlans(); rerender();
}
function setAsides() {
  const inc = mainIncome(); if (!inc) return null;
  const n = PER_YEAR[inc.frequency] || 26;
  const rows = state.entries.filter(e => isMine(e) && e.kind === 'expense' && e.frequency !== 'once' && !e.end_date && (!e.installments || nextDue(e).next))
    .map(e => ({ e, per: num(e.amount) * (state.plans[e.id] ? 12 : (PER_YEAR[e.frequency] || 12)) / n }))
    .sort((a, b) => b.per - a.per);
  const total = rows.reduce((x, r) => x + r.per, 0);
  return { inc, n, rows, total, left: num(inc.amount) - total };
}

}
function renderAuth() {

async function loadAll() {
  if (!state.me) app().innerHTML = `<div class="loading">Loading Nexo Finances…</div>`;
  try {
    const uid = state.session.user.id;
    const { data: me, error: e1 } = await db.from('profiles').select('*').eq('id', uid).single();
    if (e1) throw e1;
    state.me = me; state.household = null; state.members = [me];
    if (me.household_id) {
      const [{ data: h }, { data: mem }] = await Promise.all([
        db.from('households').select('*').eq('id', me.household_id).single(),
        db.from('profiles').select('*').eq('household_id', me.household_id).order('created_at')]);
      state.household = h; state.members = mem && mem.length ? mem : [me];
    }
    const res = await Promise.all([
      db.from('entries').select('*').order('start_date'),
      db.from('entry_payments').select('*'),
      db.from('goals').select('*').order('created_at'),
      db.from('goal_contributions').select('*').order('contributed_on'),
      db.from('loans').select('*').order('lent_on', { ascending: false }),
      db.from('loan_payments').select('*').order('paid_on')]);
    const err = res.find(r => r.error); if (err) throw err.error;
    [state.entries, state.payments, state.goals, state.contribs, state.loans, state.loanPays] = res.map(r => r.data || []);
    computePlans();
    await autoPayDue();
    render();
  } catch (err) {
    fail(err);
    app().innerHTML = `<div class="auth"><h1>Couldn’t load</h1><p>${esc(err.message || '')}</p>
      <button class="btn" onclick="loadAll()">Try again</button> <button class="btn ghost" onclick="db.auth.signOut()">Sign out</button></div>`;
  }
}

function cashFlowChart(s) {

  const W = 340, H = 180, L = 38, R = 8, T = 12, B = 32;
  const lo = Math.min(0, ...bal.slice(1)), hi = Math.max(0, ...bal.slice(1), lo < 0 ? 1 : 100);
  const x = d => L + (d - 0.5) / n * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const todayD = ymOf(new Date()) === ym ? new Date().getDate() : (t > monthStart(ym) ? n : 0);
  const pts = d => `${x(d).toFixed(1)},${y(bal[d]).toFixed(1)}`;
  let past = '', future = '';
  for (let d = 1; d <= n; d++) {
    if (d <= Math.max(1, todayD)) past += (past ? ' L' : 'M') + pts(d);
    if (d >= Math.max(1, todayD)) future += (future ? ' L' : 'M') + pts(d);
  }
  let marks = '';
  for (let d = 1; d <= n; d++) {
    if (deltaIn[d]) marks += `<circle cx="${x(d).toFixed(1)}" cy="${(H - B + 4).toFixed(1)}" r="2.6" fill="var(--in)"/>`;
    if (deltaOut[d]) marks += `<circle cx="${x(d).toFixed(1)}" cy="${(H - B + (deltaIn[d] ? 9.5 : 4)).toFixed(1)}" r="2.6" fill="var(--out)"/>`;
  }
  const ticks = [lo, (lo + hi) / 2, hi].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
    <text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${v < 0 ? '−' : ''}${short$(v)}</text>`).join('');
  const dl = [1, 8, 15, 22, n].map(d => `<text x="${x(d).toFixed(1)}" y="${H - 6}" text-anchor="middle">${d}</text>`).join('');
  const endBal = bal[n];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Running balance this month, ending at ${money(endBal)}">
      <defs><linearGradient id="cfg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${ticks}<path d="M${x(1).toFixed(1)},${y(0).toFixed(1)} ${Array.from({ length: n }, (_, i) => 'L' + pts(i + 1)).join(' ')} L${x(n).toFixed(1)},${y(0).toFixed(1)}Z" fill="url(#cfg)"/>
      <line class="zero" x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>${marks}
      ${future ? `<path d="${future}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="4 4" stroke-linejoin="round"/>` : ''}
      ${todayD ? `<path d="${past}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>` : ''}
      ${todayD && todayD <= n ? `<circle cx="${x(todayD).toFixed(1)}" cy="${y(bal[todayD]).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` : ''}
      ${dl}</svg>
    <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>Balance (dashed = projected)</span>
      <span><span class="dot" style="background:var(--in)"></span>Money in</span><span><span class="dot" style="background:var(--out)"></span>Money out</span></div>
    <p class="small muted" style="margin:8px 0 0">You end ${monthName(ym).split(' ')[0]} at <b class="${endBal >= 0 ? 'in' : 'out'}">${endBal < 0 ? '−' : ''}${money(Math.abs(endBal))}</b> if everything goes as planned.</p>`;
}
function breakdown(s) {
  const exp = s.items.filter(it => it.e.kind === 'expense');
  const due = exp.filter(it => !it.pay), late = due.filter(it => it.date < today()).length;
  const open = state.dropOpen ? 'open' : '';
  return `<details class="drop" ${open} ontoggle="state.dropOpen=this.open">
    <summary><div><h2>Payments due this month</h2><div class="small muted">${due.length ? `${due.length} left · ${money(s.expDue)}` : exp.length ? 'All paid' : 'No payments added yet'}${late ? ` · <span class="out">${late} late</span>` : ''}${exp.length - due.length ? ` · ${exp.length - due.length} paid` : ''}</div></div>
      <span class="chev" aria-hidden="true">▾</span></summary>
    <div class="inner">${due.length ? `<ul class="list">${due.map(it => itemRow(it)).join('')}</ul>` : `<p class="empty">${exp.length ? 'Every payment this month is checked off.' : 'No payments this month.'}</p>`}</div>
  </details>`;
}

/* ---------- goals ---------- */
function goalsSection() {
  return `<div class="spread sec-title"><h2>Saving goals</h2><button class="btn sm soft" data-act="newGoal">New goal</button></div>
    ${state.goals.length ? `<div class="goals">${state.goals.map(goalCard).join('')}</div>`
      : `<div class="card"><p class="muted" style="margin:0">Make a goal for anything you’re saving toward, like an autopay cushion or a trip. Share it with your household so you both can add to it.</p></div>`}`;
}
function goalCard(g) {
  const cs = state.contribs.filter(c => c.goal_id === g.id);
  const total = cs.reduce((s, c) => s + num(c.amount), 0), pct = Math.min(100, total / num(g.target_amount) * 100);
  const by = {}; cs.forEach(c => by[c.user_id] = (by[c.user_id] || 0) + num(c.amount));
  const people = Object.keys(by);
  const shared = !!g.household_id;
  const sp = g.tracks_surplus && g.owner_id === state.me.id ? surplusFor(g) : null;
  let due = '';
  if (g.target_date) {
    const months = Math.max(1, (parseD(g.target_date).getFullYear() - new Date().getFullYear()) * 12 + parseD(g.target_date).getMonth() - new Date().getMonth());
    const left = Math.max(0, num(g.target_amount) - total);
    due = left > 0 ? `${money0(left / months)}/mo to reach it by ${niceDate(g.target_date)}` : 'Reached';
  }
  return `<article class="goal">
    <div class="spread"><div style="min-width:0"><h3 class="ttl">${esc(g.name)}</h3>
      <div class="tiny muted">${shared ? '<span class="chip sh">Shared</span> ' : ''}${money0(total)} of ${money0(g.target_amount)}${due ? ' · ' + due : ''}</div></div>
      <span class="pct">${Math.round(pct)}%${sp && sp.extra > 0 ? `<span class="tiny muted" style="display:block;text-align:right;font-family:var(--body);font-weight:600">${Math.round(Math.min(100, (total + sp.extra) / num(g.target_amount) * 100))}% with this month</span>` : ''}</span></div>
    <div class="bar">${people.map(id => `<span style="width:${(by[id] / num(g.target_amount) * 100).toFixed(1)}%;background:${memberColor(id)}"></span>`).join('')}${sp ? `<span class="proj-fill" style="width:${Math.min(100 - pct, sp.extra / num(g.target_amount) * 100).toFixed(1)}%"></span>` : ''}</div>
    <div class="who-split">${people.length ? people.map(id => `<span><span class="dot" style="background:${memberColor(id)}"></span>${esc(id === state.me.id ? 'You' : memberName(id))} ${money0(by[id])}</span>`).join('') : '<span>No money added yet</span>'}</div>
    ${sp ? surplusNote(g, sp) : ''}
    <div class="row" style="margin-top:12px"><button class="btn sm" data-act="addToGoal" data-id="${g.id}" style="flex:1">Add money</button><button class="btn sm ghost" data-act="goalDetail" data-id="${g.id}">History</button></div>
  </article>`;
}
// What's left over this month (and last month, if it was never moved) for a goal that fills with surplus
function surplusFor(g) {
  const ym = ymOf(new Date()), cur = monthSummary(ym);
  const EXTRA_CATS = ['Food & Groceries', 'Entertainment', 'Personal', 'Other'];
  const oneTime = cur.items.filter(it => it.e.kind === 'expense' && it.e.frequency === 'once' && EXTRA_CATS.includes(it.e.category));
  const unplanned = oneTime.reduce((x, it) => x + (it.pay ? num(it.pay.amount) : num(it.e.amount)), 0);
  const extra = Math.max(0, cur.leftOver);
  const prevYm = nextMonth(ym, -1);
  const created = (g.created_at || '').slice(0, 7);
  const prev = created && created <= prevYm ? monthSummary(prevYm) : null;
  return { ym, extra, short: Math.min(0, cur.leftOver), unplanned, oneTime, planned: extra + unplanned,
    prevYm, prevLeft: prev && prev.leftOver > 0.009 ? prev.leftOver : 0 };
}
function surplusNote(g, sp) {
  const mon = monthName(sp.ym).split(' ')[0];
  const names = sp.oneTime.slice().sort((a, b) => num(b.e.amount) - num(a.e.amount)).slice(0, 3).map(it => esc(it.e.description)).join(', ');
  let msg = sp.short < 0
    ? `<span class="out">${mon} is ${money(-sp.short)} short</span>, so nothing extra for this goal yet.`
    : `<b class="sv">${money(sp.extra)}</b> extra in ${mon} for this goal (striped part).`;
  if (sp.unplanned > 0.009) msg += ` You had ${money(sp.planned)} before ${money(sp.unplanned)} in one-off spending${names ? ` (${names})` : ''}.`;
  return `<div class="surplus">${msg}
    ${sp.prevLeft ? `<div class="spread" style="margin-top:8px"><span>${monthName(sp.prevYm).split(' ')[0]} left you ${money(sp.prevLeft)}.</span>
      <button class="btn sm" data-act="moveLeft" data-id="${g.id}">Move it here</button></div>` : ''}</div>`;
}
async function moveLeftover(goalId) {
  const g = state.goals.find(x => x.id === goalId); if (!g) return;
  const sp = surplusFor(g); if (!sp.prevLeft) return;
  const [y, m] = sp.prevYm.split('-').map(Number);
  const last = iso(new Date(y, m, 0));
  const { data, error } = await db.from('goal_contributions').insert({ goal_id: g.id, amount: Math.round(sp.prevLeft * 100) / 100, contributed_on: last,
    note: 'Left over from ' + monthName(sp.prevYm) }).select().single();
  if (error) return fail(error);
  state.contribs.push(data); toast(`${money(sp.prevLeft)} moved to ${g.name}`); rerender();
}

    <div class="grid2"><div><label for="ga">Goal amount</label><input id="ga" type="number" inputmode="decimal" min="1" step="0.01" required value="${esc(g.target_amount)}"></div>
      <div><label for="gd">By when</label><input id="gd" type="date" value="${esc(g.target_date || '')}"></div></div>
    <label class="toggle"><input id="gt" type="checkbox" ${g.tracks_surplus ? 'checked' : ''}> Fill with what’s left each month</label>
    <span class="hint">Shows this month’s extra money as a striped part of the bar, and offers to move last month’s leftover here.</span>
    ${state.household ? `<label class="toggle"><input id="gs" type="checkbox" ${isNew || g.household_id ? 'checked' : ''}> Share with ${esc(state.household.name)}</label>
      <span class="hint">Everyone in your household can see it and add money to it.</span>` : `<p class="hint" style="margin-top:10px">Join a household to share goals.</p>`}
    <div style="height:16px"></div><div class="row"><button class="btn" type="submit" style="flex:1">${isNew ? 'Create goal' : 'Save changes'}</button>

      closeModal(); toast('Goal deleted'); loadAll();

function openContribForm(goalId) {

/* ==========================================================
   MONTHLY
   ========================================================== */
function viewMonthly() {
  const s = monthSummary(state.month), ym = state.month, n = daysIn(ym), t = today();
  const byDay = {};
  s.items.forEach(it => (byDay[it.date] = byDay[it.date] || []).push(it));
  const first = parseD(monthStart(ym)).getDay();
  let cells = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="dow" aria-hidden="true">${d}</div>`).join('');
  for (let i = 0; i < first; i++) cells += '<div class="blank"></div>';
  for (let d = 1; d <= n; d++) {
    const date = `${ym}-${pad(d)}`, its = byDay[date] || [];
    const net = its.reduce((x, it) => x + (it.e.kind === 'income' ? 1 : -1) * (it.pay ? num(it.pay.amount) : num(it.e.amount)), 0);
    const unpaidOut = its.some(it => it.e.kind === 'expense' && !it.pay), anyIn = its.some(it => it.e.kind === 'income');
    const allDone = its.length && its.every(it => it.pay);
    cells += `<button class="day ${date === t ? 'today' : ''} ${state.calSel === date ? 'sel' : ''}" data-act="day" data-date="${date}"
      aria-label="${longDate(date)}${its.length ? ', ' + its.length + ' item' + (its.length > 1 ? 's' : '') : ''}">
      <span class="n">${d}</span>${its.length ? `<span class="a ${net >= 0 ? 'in' : 'out'}">${net >= 0 ? '+' : '−'}${short$(net)}</span>` : ''}
      ${its.length ? `<span class="dots">${allDone ? '<i style="background:var(--muted)"></i>' : `${unpaidOut ? `<i style="background:${date < t ? 'var(--out)' : 'var(--warn)'}"></i>` : ''}${anyIn ? '<i style="background:var(--in)"></i>' : ''}`}</span>` : ''}</button>`;
  }
  const sel = state.calSel && state.calSel.startsWith(ym) ? state.calSel : null;
  const upcoming = s.items.filter(it => !it.pay);
  const done = s.items.filter(it => it.pay);
  return `
    ${planSection()}
    <section class="card"><div class="card-head"><h2>Monthly projection</h2></div>
      <div class="proj"><div><div class="k">Income</div><div class="v in">${money0(s.incPlan)}</div></div>
        <div><div class="k">Expenses</div><div class="v out">${money0(s.expPlan)}</div></div>
        <div class="left"><div class="k">${s.leftOver >= 0 ? 'Left over' : 'Short'}</div><div class="v">${s.leftOver < 0 ? '−' : ''}${money0(Math.abs(s.leftOver))}</div></div></div>
      ${s.carry ? `<div class="spread small" style="margin-top:12px"><span class="muted">From last month</span><b class="${s.carry >= 0 ? 'in' : 'out'}">${s.carry < 0 ? '−' : '+'}${money(Math.abs(s.carry))}</b></div>
        <div class="spread" style="margin-top:4px;font-weight:700"><span>End of month balance</span><span class="amt ${s.endBalance >= 0 ? 'in' : 'out'}">${s.endBalance < 0 ? '−' : ''}${money(Math.abs(s.endBalance))}</span></div>` : ''}
      ${s.saved ? `<p class="small muted" style="margin:10px 0 0">Includes ${money(s.saved)} you put into saving goals.</p>` : ''}
    </section>
    <section class="card"><div class="cal">${cells}</div>
      <div class="legend" style="margin-top:10px"><span><span class="dot" style="background:var(--warn)"></span>To pay</span>
        <span><span class="dot" style="background:var(--out)"></span>Late</span><span><span class="dot" style="background:var(--in)"></span>Income</span>
        <span><span class="dot" style="background:var(--muted)"></span>All done</span></div>
      ${sel ? `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><h3>${longDate(sel)}</h3>
        ${(byDay[sel] || []).length ? `<ul class="list">${byDay[sel].map(it => itemRow(it, { showDate: false })).join('')}</ul>` : '<p class="empty">Nothing due this day.</p>'}</div>` : ''}
    </section>
    <h2 class="sec-title">Upcoming this month</h2>
    <section class="card">${upcoming.length ? `<ul class="list">${upcoming.map(it => itemRow(it)).join('')}</ul>`
      : `<p class="empty">${s.items.length ? 'Everything this month is checked off.' : 'Nothing scheduled. Add income and bills in the Data tab.'}</p>`}</section>
    ${done.length ? `<details class="drop"><summary><div><h2>Done</h2><div class="small muted">${done.length} checked off</div></div><span class="chev" aria-hidden="true">▾</span></summary>
      <div class="inner"><ul class="list">${done.map(it => itemRow(it)).join('')}</ul></div></details>` : ''}`;
}

/* ==========================================================
   HOUSEHOLD
   ========================================================== */
function planSection() {
  const mine = state.entries.filter(e => isMine(e) && e.kind === 'expense' && e.due_day && !e.end_date && e.frequency !== 'once');
  const mon = ym => monthName(ym).split(' ')[0];
  const rows = mine.map(e => {
    const pl = state.plans[e.id];
    if (pl) { const cp = pl.cp;
      return { order: 0, html: `<li style="display:block"><div class="spread"><div class="ttl">${esc(e.description)}</div><span class="chip late">Late now · ${money(e.late_fee)} fee</span></div>
        <div class="small" style="margin-top:4px">On time from <b>${mon(cp.switchYm)}</b>: paid by the ${ordinal(e.due_day)}${cp.payWith ? ` with your ${niceDate(cp.payWith)} paycheck` : ''}.
        ${cp.keepDates.length ? `<span class="muted">Until then: ${cp.keepDates.map(niceDate).join(', ')}.</span>` : ''}
        ${cp.savedFees ? ` <span class="in">${money(cp.savedFees)} less in late fees.</span>` : ''}</div>
        <div class="tiny muted" style="margin-top:4px">Already in your calendar and balance. It moves earlier on its own if you end up with more money.</div></li>` };
    }
    const cp = num(e.late_fee) > 0 ? catchUpPlan(e) : null;
    if (cp && cp.lateNow) return { order: 0, html: `<li style="display:block"><div class="spread"><div class="ttl">${esc(e.description)}</div><span class="chip late">Late · ${money(e.late_fee)} fee</span></div>
        <div class="small" style="margin-top:4px">Not enough room to pay it on time in the next 12 months yet. Saving into the AutoPay Buffer is what gets you there.</div></li>` };
    return { order: e.on_autopay ? 2 : 1, html: `<li><div class="grow"><div class="ttl">${esc(e.description)}</div>
        <div class="tiny ${e.on_autopay ? 'in' : 'muted'}">${e.on_autopay ? 'On autopay' : 'On time'} · due the ${ordinal(e.due_day)}${!e.on_autopay && num(e.autopay_discount) ? ` · autopay saves ${money(e.autopay_discount)}/mo` : ''}</div></div>
        ${autopayToggle(e)}</li>` };
  }).sort((a, b) => a.order - b.order);
  const sa = setAsides();
  return `${sa && sa.rows.length ? `<details class="drop"><summary><div><h2>From each paycheck</h2>
        <div class="small muted">Set aside ${money(sa.total)} of ${money(sa.inc.amount)} · <span class="${sa.left >= 0 ? 'in' : 'out'}">${sa.left >= 0 ? money(sa.left) + ' left' : money(-sa.left) + ' short'}</span></div></div><span class="chev" aria-hidden="true">▾</span></summary>
      <div class="inner"><ul class="list">${sa.rows.map(r => `<li><div class="grow"><div class="ttl">${esc(r.e.description)}</div>
        <div class="tiny muted">${money(r.e.amount)} ${state.plans[r.e.id] ? 'monthly' : FREQ[r.e.frequency].toLowerCase()}</div></div><span class="amt">${money(r.per)}</span></li>`).join('')}</ul>
        <p class="tiny muted" style="margin:8px 0 4px">Each bill split evenly across your ${sa.n} paychecks a year, so big ones like the house never catch you short.</p></div></details>` : ''}`;
}
function autopayToggle(e) {
  return `<button class="ap ${e.on_autopay ? 'on' : ''}" data-act="autopay" data-id="${e.id}" aria-pressed="${!!e.on_autopay}" aria-label="Autopay for ${esc(e.description)}"><span class="box">✓</span>Autopay</button>`;
}
function noHousehold(what) {
  return `<section class="card"><h2>Set up your household</h2><p class="muted" style="margin-top:6px">${what} One of you creates it and shares the code. The other joins with it.</p>
    <div class="row"><button class="btn" data-act="createHH">Create household</button><button class="btn ghost" data-act="joinHH">Join with a code</button></div></section>`;
}
function viewHousehold() {
  if (!state.household) return noHousehold('See what each of you puts into food, entertainment and everything else, share saving goals, and track money you lend each other.');
  const ym = state.month;
  const paid = state.payments.filter(p => p.due_date.startsWith(ym)).map(p => ({ p, e: state.entries.find(e => e.id === p.entry_id) }))
    .filter(x => x.e && x.e.kind === 'expense' && x.e.is_household);
  const total = paid.reduce((s, x) => s + num(x.p.amount), 0);
  const byM = {}, byC = {};
  paid.forEach(({ p, e }) => {
    byM[e.user_id] = (byM[e.user_id] || 0) + num(p.amount);
    byC[e.category] = byC[e.category] || { t: 0, by: {} };
    byC[e.category].t += num(p.amount); byC[e.category].by[e.user_id] = (byC[e.category].by[e.user_id] || 0) + num(p.amount);
  });
  const cats = Object.entries(byC).sort((a, b) => b[1].t - a[1].t);
  const split = (by, t) => `<div class="track" style="display:flex;height:12px">${state.members.map(m => by[m.id] ? `<span style="width:${(by[m.id] / t * 100).toFixed(1)}%;background:${memberColor(m.id)}"></span>` : '').join('')}</div>`;
  const sharedGoals = state.goals.filter(g => g.household_id);
  return `
    <section class="card"><div class="small muted">Paid together in ${monthName(ym).split(' ')[0]}</div>
      <div class="num" style="font-size:2.2rem;font-weight:800;line-height:1.1;margin:2px 0 12px">${money(total)}</div>
      ${total ? split(byM, total) : ''}
      <div class="legend" style="margin-top:10px">${state.members.map(m => `<span><span class="dot" style="background:${memberColor(m.id)}"></span>${esc(m.display_name)} <b style="color:var(--ink)">${money(byM[m.id] || 0)}</b>${total ? ` (${Math.round((byM[m.id] || 0) / total * 100)}%)` : ''}</span>`).join('')}</div>
    </section>
    <section class="card"><div class="card-head"><h2>Who put in what</h2></div>
      ${cats.length ? cats.map(([c, v]) => `<div style="padding:10px 0;border-top:1px solid var(--line)">
        <div class="spread" style="margin-bottom:6px;font-weight:600"><span>${CAT_ICON[c] || '•'} ${esc(c)}</span><span class="amt">${money(v.t)}</span></div>${split(v.by, v.t)}
        <div class="who-split" style="margin-top:6px">${state.members.map(m => `<span><span class="dot" style="background:${memberColor(m.id)}"></span>${esc(m.display_name)} ${money(v.by[m.id] || 0)}</span>`).join('')}</div></div>`).join('')
        : `<p class="empty">Nothing paid together yet this month. Payments you check off show up here when “Count in Household” is on.</p>`}
    </section>
    <div class="spread sec-title"><h2>Shared goals</h2><button class="btn sm soft" data-act="newGoal">New goal</button></div>
    ${sharedGoals.length ? `<div class="goals">${sharedGoals.map(goalCard).join('')}</div>` : `<div class="card"><p class="muted" style="margin:0">No shared goals yet. Create one, like a trip, and you can both add money to it.</p></div>`}
    ${viewLoans()}
    ${state.members.length < 2 ? `<section class="card"><h2>Invite your partner</h2>
      <p class="muted" style="margin-top:6px">They create their own account, then go to Household and tap “Join with a code”.</p><div class="code">${esc(state.household.invite_code)}</div></section>` : ''}`;
}
function openHouseholdSetup(mode) {
  const create = mode === 'create';
  openModal(create ? 'Create household' : 'Join household', `<form id="hf">
    ${create ? `<label for="hn">Household name</label><input id="hn" value="Our home" required>`

/* ---------- loans (only the lender manages a loan) ---------- */
function loanPaid(id) { return state.loanPays.filter(p => p.loan_id === id).reduce((s, p) => s + num(p.amount), 0); }
function viewLoans() {
  const others = state.members.filter(m => m.id !== state.me.id);
  const lent = state.loans.filter(l => l.lender_id === state.me.id), borrowed = state.loans.filter(l => l.borrower_id === state.me.id);
  const owed = lent.reduce((s, l) => s + Math.max(0, num(l.amount) - loanPaid(l.id)), 0);
  const iOwe = borrowed.reduce((s, l) => s + Math.max(0, num(l.amount) - loanPaid(l.id)), 0);
  const card = (l, mine) => {
    const paid = loanPaid(l.id), left = Math.max(0, num(l.amount) - paid), pct = Math.min(100, paid / num(l.amount) * 100);
    return `<li style="display:block">
      <div class="spread"><div class="grow"><div class="ttl">${mine ? 'To ' + esc(memberName(l.borrower_id)) : 'From ' + esc(memberName(l.lender_id))}${l.description ? ': ' + esc(l.description) : ''}</div>
        <div class="tiny muted">Lent ${niceDate(l.lent_on)} · ${money(l.amount)} · ${money(paid)} paid back</div></div>
        <div style="text-align:right">${left > 0 ? `<div class="amt">${money(left)}</div><div class="tiny muted">left</div>` : '<span class="chip sh">Paid back</span>'}</div></div>
      <div class="track" style="height:8px;margin:8px 0"><span class="done" style="width:${pct.toFixed(1)}%;background:var(--in)"></span></div>
      <div class="row">${mine && left > 0 ? `<button class="btn sm" data-act="payLoan" data-id="${l.id}">Record payment</button>` : ''}
        <button class="btn sm ghost" data-act="loanHistory" data-id="${l.id}">History</button>
        ${mine ? `<button class="btn sm danger" data-act="delLoan" data-id="${l.id}">Delete</button>` : `<span class="tiny muted">${esc(memberName(l.lender_id))} manages this loan</span>`}</div></li>`;
  };
  return `<div class="spread sec-title"><h2>Loans between us</h2>${others.length ? '<button class="btn sm soft" data-act="newLoan">I lent money</button>' : ''}</div>
    <section class="card"><div class="grid2"><div><div class="tiny muted">Owed to me</div><div class="num in" style="font-size:1.5rem;font-weight:800">${money(owed)}</div></div>
      <div><div class="tiny muted">I owe</div><div class="num" style="font-size:1.5rem;font-weight:800">${money(iOwe)}</div></div></div>
      ${lent.length || borrowed.length ? `<ul class="list" style="margin-top:8px">${lent.map(l => card(l, true)).join('')}${borrowed.map(l => card(l, false)).join('')}</ul>`
        : `<p class="empty" style="padding-bottom:0">${others.length ? 'When you lend money, tap “I lent money”. You record each payment as it comes back.' : 'Your partner needs to join before you can add loans.'}</p>`}</section>`;
}
function openLoanForm() {
  const others = state.members.filter(m => m.id !== state.me.id);
  openModal('I lent money', `<form id="lf"><label for="lb">To</label><select id="lb">${others.map(m => `<option value="${m.id}">${esc(m.display_name)}</option>`).join('')}</select>
    <div class="grid2"><div><label for="la">Amount</label><input id="la" type="number" inputmode="decimal" step="0.01" min="0.01" required></div>
      <div><label for="ld">Date</label><input id="ld" type="date" value="${today()}" required></div></div>
    <label for="ln">What for?</label><input id="ln" placeholder="e.g. Car repair">
    <div style="height:16px"></div><button class="btn block" type="submit">Save loan</button></form>`, o => {
    $('#lf', o).onsubmit = async ev => {
      ev.preventDefault();
      const { error } = await db.from('loans').insert({ borrower_id: $('#lb', o).value, amount: num($('#la', o).value), lent_on: $('#ld', o).value, description: $('#ln', o).value.trim() || null });
      if (error) return fail(error); closeModal(); toast('Loan saved'); loadAll();
    };
  });
}
function openPaymentForm(loanId) {
  const l = state.loans.find(x => x.id === loanId); if (!l) return;
  const left = Math.max(0, num(l.amount) - loanPaid(l.id));
  openModal('Record payment', `<p class="muted">${esc(memberName(l.borrower_id))} still owes ${money(left)} of ${money(l.amount)}.</p>
    <form id="pf"><div class="grid2"><div><label for="pa">Amount paid back</label><input id="pa" type="number" inputmode="decimal" step="0.01" min="0.01" max="${left}" value="${left}" required></div>
      <div><label for="pd">Date</label><input id="pd" type="date" value="${today()}" required></div></div>
    <label for="pn">Note</label><input id="pn"><div style="height:16px"></div><button class="btn block" type="submit">Save payment</button></form>`, o => {
    $('#pf', o).onsubmit = async ev => {
      ev.preventDefault();
      const amt = num($('#pa', o).value);
      if (amt > left + 0.001) return toast(`That’s more than the ${money(left)} left.`, true);
      const { error } = await db.from('loan_payments').insert({ loan_id: l.id, amount: amt, paid_on: $('#pd', o).value, note: $('#pn', o).value.trim() || null });
      if (error) return fail(error); closeModal();
      toast(left - amt > 0.001 ? `Saved. ${money(left - amt)} still owed.` : 'Paid back in full'); loadAll();
    };
  });
}
function openLoanHistory(loanId) {
  const l = state.loans.find(x => x.id === loanId); if (!l) return;
  let run = num(l.amount);
  const rows = [`<li><div class="grow"><div class="ttl">Lent</div><div class="tiny muted">${niceDate(l.lent_on)}</div></div><span class="amt">${money(l.amount)}</span></li>`]
    .concat(state.loanPays.filter(p => p.loan_id === l.id).map(p => { run -= num(p.amount); return `<li><div class="grow"><div class="ttl">Paid back${p.note ? ': ' + esc(p.note) : ''}</div>
      <div class="tiny muted">${niceDate(p.paid_on)} · ${money(Math.max(0, run))} left after</div></div><span class="amt in">−${money(p.amount)}</span></li>`; }));
  openModal('Loan history', `<ul class="list">${rows.join('')}</ul>`);
}
async function deleteLoan(id) {
  if (!confirm('Delete this loan and its payment history?')) return;
  const { error } = await db.from('loans').delete().eq('id', id); if (error) return fail(error);
  toast('Loan deleted'); loadAll();
}

/* ==========================================================
   DATA
   ========================================================== */
function viewData() {
  const f = state.form, kind = f.kind || 'expense', inc = kind === 'income';
  const freq = f.frequency || 'monthly';
  const mine = state.entries.filter(e => isMine(e) && !(e.end_date && e.end_date < e.start_date));
  const flt = state.dataFilter;
  const shown = mine.filter(e => flt === 'all' || (flt === 'expense' && e.kind === 'expense') || (flt === 'income' && e.kind === 'income')
    || (flt === 'recurring' && e.frequency !== 'once' && !e.end_date) || (flt === 'ended' && (e.end_date || (e.frequency === 'once' && e.start_date < today()))));
  const rows = shown.map(e => ({ e, nd: nextDue(e) })).sort((a, b) => (a.nd.overdue.length ? -1 : 0) - (b.nd.overdue.length ? -1 : 0) || (a.nd.next || '9').localeCompare(b.nd.next || '9'));
  const commit = mine.filter(e => e.kind === 'expense' && !e.end_date && e.frequency !== 'once');
  const monthlyEq = e => ({ weekly: 52 / 12, biweekly: 26 / 12, fourweekly: 13 / 12, monthly: 1, installments: 1, yearly: 1 / 12 }[e.frequency] || 0) * num(e.amount);
  const fixed = commit.reduce((s, e) => s + monthlyEq(e), 0);
  return `
    <section class="card"><h2>Add income or expense</h2>
      <form id="entryForm" style="margin-top:12px" autocomplete="off">
        <div class="seg kind" role="group" aria-label="Type">
          <button type="button" data-act="kind" data-v="expense" aria-pressed="${!inc}">Expense</button>
          <button type="button" data-act="kind" data-v="income" aria-pressed="${inc}">Income</button></div>
        <label for="fd">Description</label><input id="fd" required value="${esc(f.description || '')}" placeholder="${inc ? 'e.g. Paycheck' : 'e.g. Disney+'}">
        <div class="grid2"><div><label for="fa">Amount</label><input id="fa" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${esc(f.amount || '')}" placeholder="0.00"></div>
          <div><label for="fc">Category</label><select id="fc">${catOptions(kind, f.category || (inc ? 'Salary' : 'Subscriptions'))}</select></div></div>
        <div class="grid2"><div><label for="ff">How often</label><select id="ff">${Object.entries(FREQ).map(([k, v]) => `<option value="${k}" ${k === freq ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <div><label for="fs" id="fsl">${freq === 'once' ? 'Date' : 'First date'}</label><input id="fs" type="date" required value="${esc(f.start_date || today())}"></div></div>
        <div id="instWrap" ${freq === 'installments' ? '' : 'hidden'}><label for="fi">Number of payments</label><input id="fi" type="number" inputmode="numeric" min="1" max="600" value="${esc(f.installments || '')}" placeholder="e.g. 12"></div>
        <label>Status</label>
        <div class="seg" role="group" aria-label="Status" id="fst">
          <button type="button" data-v="todo" aria-pressed="${f.status !== 'done'}">${inc ? 'Still coming' : 'To pay'}</button>
          <button type="button" data-v="done" aria-pressed="${f.status === 'done'}">${inc ? 'Already received' : 'Already paid'}</button></div>
        <span class="hint" id="fsth" style="margin-top:4px">${f.status === 'done' ? 'Every date up to today gets checked off.' : 'You’ll check it off when it happens.'}</span>
        ${inc ? '' : `<label class="toggle"><input id="fap" type="checkbox" ${f.on_autopay ? 'checked' : ''}> On autopay</label>
          <span class="hint">Autopay bills check themselves off on their date.</span>`}
        ${state.household ? `<label class="toggle"><input id="fh" type="checkbox" ${f.is_household === false ? '' : 'checked'}> Count in Household</label>
          <span class="hint">Turn off for personal things your household shouldn’t see.</span>` : ''}
        <div style="height:16px"></div><button class="btn block" type="submit">${inc ? 'Add income' : 'Add expense'}</button>
      </form></section>

    <div class="spread sec-title"><h2>All my transactions</h2><span class="small muted">Fixed costs ≈ ${money0(fixed)}/mo</span></div>
    <div class="filters" role="group" aria-label="Filter">${[['all', 'All'], ['expense', 'Expenses'], ['income', 'Income'], ['recurring', 'Recurring'], ['ended', 'Past & cancelled']]
      .map(([v, l]) => `<button data-act="filter" data-v="${v}" aria-pressed="${flt === v}">${l}</button>`).join('')}</div>
    <section class="card">${rows.length ? `<ul class="list">${rows.map(({ e, nd }) => {
      const inc2 = e.kind === 'income';
      const status = nd.overdue.length ? `<span class="chip late">${nd.overdue.length} ${inc2 ? 'not received' : 'late'}</span>`
        : nd.next ? `Next ${niceDate(nd.next)}` : (e.end_date ? 'Cancelled' : 'Done');
      return `<li style="cursor:pointer" data-act="editEntry" data-id="${e.id}"><span class="ic ${inc2 ? 'inc' : 'ex'}" aria-hidden="true">${CAT_ICON[e.category] || '•'}</span>
        <div class="grow"><div class="ttl">${esc(e.description)}</div>
          <div class="tiny muted">${esc(FREQ[e.frequency])}${e.frequency === 'installments' ? ' (' + e.installments + ')' : ''} · ${esc(e.category)} · ${status}${!e.is_household ? ' · Private' : ''}</div></div>
        <span class="amt ${inc2 ? 'in' : ''}">${inc2 ? '+' : '−'}${money(e.amount)}</span>${!inc2 && e.frequency !== 'once' && !e.end_date ? autopayToggle(e) : ''}</li>`;
    }).join('')}</ul>` : `<p class="empty">${mine.length ? 'Nothing matches this filter.' : 'Nothing here yet. Add your paycheck first, then each bill and subscription.'}</p>`}</section>`;
}
function readForm() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const st = document.querySelector('#fst [aria-pressed="true"]');
  const fh = document.getElementById('fh');
  return { kind: state.form.kind, description: g('fd'), amount: g('fa'), category: g('fc'), frequency: g('ff'), start_date: g('fs'),
    installments: g('fi'), status: st ? st.dataset.v : 'todo', is_household: fh ? fh.checked : true,
    on_autopay: !!(document.getElementById('fap') && document.getElementById('fap').checked) };
}
function bindEntryForm(f) {
  const ff = $('#ff', f);
  ff.onchange = () => { $('#instWrap', f).hidden = ff.value !== 'installments'; $('#fsl', f).textContent = ff.value === 'once' ? 'Date' : 'First date'; };
  f.querySelectorAll('#fst button').forEach(b => b.onclick = () => {
    f.querySelectorAll('#fst button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#fsth', f).textContent = b.dataset.v === 'done' ? 'Every date up to today gets checked off.' : 'You’ll check it off when it happens.';
  });
  f.onsubmit = async ev => {
    ev.preventDefault();
    const v = readForm();
    if (v.frequency === 'installments' && !(parseInt(v.installments, 10) >= 1)) return toast('Enter how many payments the plan has.', true);
    const row = { kind: v.kind, description: v.description.trim(), amount: num(v.amount), category: v.category, frequency: v.frequency,
      start_date: v.start_date, installments: v.frequency === 'installments' ? parseInt(v.installments, 10) : null, is_household: v.is_household,
      on_autopay: v.kind === 'expense' && v.on_autopay };
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    const { data: e, error } = await db.from('entries').insert(row).select().single();
    if (error) { btn.disabled = false; return fail(error); }
    if (v.status === 'done') {
      const dates = occurrences(e, e.start_date, iso(new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() + 1))).slice(-36);
      if (dates.length) {
        const { error: pe } = await db.from('entry_payments').insert(dates.map(d => ({ entry_id: e.id, due_date: d, amount: e.amount, paid_on: d })));
        if (pe) fail(pe);
      }
    }
    state.form = { kind: v.kind };
    toast(`${row.description} added`);
    loadAll();
  };
}

        row.late_fee = num($('#elf', o).value); row.autopay_discount = num($('#ead', o).value); }
      if ($('#eap', o)) row.on_autopay = $('#eap', o).checked;
      const { error } = await db.from('entries').update(row).eq('id', e.id); if (error) return fail(error);
      closeModal(); toast('Changes saved'); loadAll();
    };
    const stop = $('#estop', o); if (stop) stop.onclick = async () => {
      const { error } = await db.from('entries').update({ end_date: today() }).eq('id', e.id); if (error) return fail(error);
      closeModal(); toast(`${e.description} cancelled. No more future dates.`); loadAll();
    };
    const res = $('#eres', o); if (res) res.onclick = async () => {
      const { error } = await db.from('entries').update({ end_date: null }).eq('id', e.id); if (error) return fail(error);
      closeModal(); toast(`${e.description} restarted`); loadAll();
    };
    $('#edel', o).onclick = async () => {
      if (!confirm(`Delete “${e.description}” and all its checkmarks? To keep the history, use “Cancel from today” instead.`)) return;
      const { error } = await db.from('entries').delete().eq('id', e.id); if (error) return fail(error);
      closeModal(); toast('Deleted'); loadAll();
    };
  });
}

/* ==========================================================
   SETTINGS
   ========================================================== */
function openSettings() {
  openModal('Settings', `<form id="sf"><label for="sn">My name</label><input id="sn" value="${esc(state.me.display_name)}" required>
    <div style="height:10px"></div><button class="btn sm" type="submit">Save name</button></form>
    <div style="height:20px"></div><h3>Household</h3>
    ${state.household ? `<p class="muted small" style="margin:4px 0">${esc(state.household.name)}: ${state.members.map(m => esc(m.display_name)).join(', ')}</p>
      <p class="small" style="margin:0">Invite code</p><div class="code">${esc(state.household.invite_code)}</div>
      <div style="height:10px"></div><button class="btn sm danger" id="leaveHH">Leave household</button>`
      : `<p class="muted small">You’re not in a household yet. Set it up from the Household tab.</p>`}
    <div style="height:20px"></div><p class="small muted" style="margin:0 0 8px">Signed in as ${esc(state.session.user.email)}</p>
    <button class="btn ghost block" id="signOut">Sign out</button>`, o => {
    $('#sf', o).onsubmit = async ev => {
      ev.preventDefault();
      const name = $('#sn', o).value.trim();
      const { error } = await db.from('profiles').update({ display_name: name }).eq('id', state.me.id); if (error) return fail(error);
      closeModal(); toast('Name saved'); loadAll();
    };
    const leave = $('#leaveHH', o); if (leave) leave.onclick = async () => {
      if (!confirm('Leave the household? Your data stays yours, but you stop seeing shared data.')) return;
      const { error } = await db.rpc('leave_household'); if (error) return fail(error);
      closeModal(); toast('You left the household'); loadAll();
    };
    $('#signOut', o).onclick = async () => { closeModal(); state.me = null; await db.auth.signOut(); };
  });
}

/* ---------- auto-update: reload when a newer version is published ---------- */
const APP_VERSION = '202610151938';
async function checkVersion() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { v } = await r.json();
    if (v && v !== APP_VERSION && !document.getElementById('overlay')) location.replace(location.pathname + '?v=' + v);
  } catch (_) { /* offline: keep current version */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
checkVersion();

init();
</script>
